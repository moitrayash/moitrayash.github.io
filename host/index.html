<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>Host</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
background: #fff;
color: #000;
font-family: Georgia, 'Times New Roman', serif;
line-height: 1.8;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 60px 24px;
}
.wrap {
width: 100%;
max-width: 720px;
text-align: center;
}
h1 {
font-size: 48px;
font-weight: normal;
letter-spacing: 2px;
line-height: 1.2;
}
.rule {
width: 128px;
height: 1px;
background: #999;
margin: 40px auto 0;
}
@media (max-width: 600px) {
body { padding: 56px 20px; }
h1 { font-size: 36px; }
}
</style>
</head>
<body>
<div class="wrap">
<h1>Host</h1>
<div class="rule"></div>
</div>
</body>
</html>
